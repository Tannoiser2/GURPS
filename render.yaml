services:
  - type: web
    name: gurps-backend
    # Runtime Docker: il runtime python nativo di Render non consente apt-get,
    # necessario per installare tesseract (OCR dei PDF con text-layer corrotto).
    # Per tornare al runtime python nativo (senza OCR) ripristinare:
    #   runtime: python
    #   buildCommand: pip install -r backend/requirements.txt
    #   startCommand: cd backend && uvicorn App.main:app --host 0.0.0.0 --port $PORT --workers 1
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      # OCR dei PDF con text-layer corrotto. Sul piano free (CPU lenta) l'OCR può
      # far sforare il timeout di compilazione (15 min), quindi è DISATTIVO di
      # default. Per attivarlo (PDF illeggibili) alzare a "8" — c'è comunque un
      # budget di tempo (OCR_TIME_BUDGET_S, default 120s) che impedisce timeout.
      - key: OCR_MAX_PAGES
        value: "0"
      # Compilazione PDF sequenziale (1 chiamata LLM alla volta): RAM di picco
      # minima per restare entro i 512MB del piano free ed evitare l'OOM.
      # Alzare (es. "2") se si passa a un'istanza con più memoria.
      - key: PDF_COMPILE_MAX_WORKERS
        value: "1"
      # Estrazione narrativa via LLM (indizi/PNG/location/clock dal testo in prosa).
      # SENZA questa, la compilazione PDF usa solo le regex e produce poche clue,
      # stat-block come indizi e location con ID generici (score ~25/100).
      # È il motore vero dell'import PDF: deve stare acceso in produzione.
      - key: GURPS_ENABLE_LLM_EXTRACTORS
        value: "1"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_AI_STUDIO_KEY
        sync: false
