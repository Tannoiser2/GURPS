name: Genera Avventure (Generi × Scale)

on:
  workflow_dispatch:
    inputs:
      genres:
        description: "Generi (spazio tra loro). Vuoto = tutti e 6."
        required: false
        default: "action fantasy horror investigation romance sci_fi"
      scales:
        description: "Scale: compact standard epic"
        required: false
        default: "compact standard epic"
      count:
        description: "Avventure per combinazione (1 = 18 tot, 2 = 36 tot)"
        required: false
        default: "1"

jobs:
  genera:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verifica ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "❌ Secret ANTHROPIC_API_KEY non configurato nel repo."
            echo ""
            echo "Come aggiungerlo:"
            echo "  GitHub → repo → Settings → Secrets and variables → Actions"
            echo "  → New repository secret"
            echo "  Nome:   ANTHROPIC_API_KEY"
            echo "  Valore: la tua chiave (inizia con sk-ant-api03-...)"
            exit 1
          fi
          echo "✅ ANTHROPIC_API_KEY presente (${#ANTHROPIC_API_KEY} caratteri)"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: |
          pip install --upgrade pip

          # Dipendenze obbligatorie del backend
          pip install \
            "anthropic>=0.50" \
            "pydantic>=2.0.0" \
            "python-dotenv>=1.0.0" \
            "openai>=1.0.0" \
            "pdfplumber>=0.10.0" \
            "Pillow>=10.0.0" \
            "fastapi>=0.110.0" \
            "python-multipart>=0.0.9"

          # google-genai opzionale (il backend gestisce ImportError)
          pip install "google-genai" || echo "⚠ google-genai non installato (opzionale)"

      - name: Genera avventure (import diretto, senza uvicorn)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 scripts/genera_direct.py \
            --genres ${{ github.event.inputs.genres }} \
            --scales ${{ github.event.inputs.scales }} \
            --count  ${{ github.event.inputs.count }}

      - name: Commit e push risultati
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/compiled_adventures/
          git diff --cached --stat

          if git diff --cached --quiet; then
            echo "⚠ Nessuna avventura nuova — niente da committare"
            exit 0
          fi

          NEW=$(git diff --cached --name-only | grep -c "\.json$" || true)
          git commit -m "gen: $NEW avventure nuove (${{ github.event.inputs.genres }} × ${{ github.event.inputs.scales }}) [skip ci]"
          git push origin main
          echo "✅ $NEW avventure committate su main"
